services:
  identity-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${PG_DATABASE:?Set PG_DATABASE}
      DB_USER: identity_app
      DB_PASSWORD: ${IDENTITY_APP_PASSWORD:?Set IDENTITY_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
    depends_on:
      identity-db-migrate:
        condition: service_completed_successfully
    networks:
      platform:
        aliases: [educk-identity-api]
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8081/api/v1/auth/health']
      interval: 10s
      timeout: 5s
      retries: 30
